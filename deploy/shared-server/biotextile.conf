# Bio Textile Solution UK — served by the Spotfluence nginx on the shared server.
# Drop-in file for spotinfluence/docker/nginx/ (loaded alongside default.conf, which is untouched).
#
#   Internet ─443─▶ nginx ─┬─ spotfluence.co.uk              ─▶ app:3000            (Spotfluence)
#                          └─ biotextextilesolution.com      ─▶ biotextile-app:3000 (this site)
#
# TLS protocols/ciphers are inherited from default.conf; only the certificate differs.
# The certificate is issued BEFORE this file is added (see README in this folder) — nginx will not
# reload with a server block that points at a certificate that does not exist yet.

limit_req_zone $binary_remote_addr zone=biotextile_forms:10m rate=10r/m;

# ---- www → apex ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.biotextextilesolution.com;
    ssl_certificate     /etc/letsencrypt/live/biotextextilesolution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biotextextilesolution.com/privkey.pem;
    return 301 https://biotextextilesolution.com$request_uri;
}

# ---- Site ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name biotextextilesolution.com;
    ssl_certificate     /etc/letsencrypt/live/biotextextilesolution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biotextextilesolution.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;

    # Resolve our container per request through Docker's DNS instead of at startup, so nginx still
    # starts and reloads (and Spotfluence keeps serving) even when the Bio Textile app is stopped.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $biotextile http://biotextile-app:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    location /api/ {
        limit_req zone=biotextile_forms burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $biotextile;
    }

    location / {
        proxy_pass $biotextile;
    }
}
